    <meta charset="UTF-8" />
    <script>
      (function () {
        // Intercept and silence benign Vite HMR / WebSocket development logs
        function isViteHmrError(target) {
          if (!target) return false;
          var text = typeof target === 'string' ? target : (target.message || target.stack || String(target));
          return (
            text.indexOf('[vite]') !== -1 ||
            text.indexOf('WebSocket closed without opened') !== -1 ||
            text.indexOf('failed to connect to websocket') !== -1
          );
        }

        var origError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteHmrError(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteHmrError(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        var origDebug = console.debug;
        console.debug = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteHmrError(arguments[i])) return;
          }
          origDebug.apply(console, arguments);
        };

        window.addEventListener(
          'error',
          function (e) {
            if (isViteHmrError(e.message) || isViteHmrError(e.error)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (isViteHmrError(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
